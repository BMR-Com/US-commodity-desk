name: ai_daily
# Pre-written AI reads and FAQ answers for the chatbot, generated with the GROQ_API_KEY secret (no key needed by visitors).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['models/ai_daily.py', '.github/workflows/ai_daily.yml']
  schedule:
    - cron: '55 11 * * *'   # after the morning brief (7:35 ET in daylight time)
    - cron: '45 21 * * 1-5' # after the US close data run
permissions: {contents: write}
concurrency: {group: ai_daily, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests pandas numpy
      - name: refresh knowledge cards
        run: python models/ai_context.py
      - name: AI reads (Groq)
        env: {GROQ_API_KEY: '${{ secrets.GROQ_API_KEY }}'}
        run: python -u models/ai_daily.py
      - name: commit
        run: |
          git config user.name "bmr-data-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/ai
          git diff --cached --quiet && exit 0
          git commit -q -m "ai: desk reads $(date -u +%F' '%H:%M)"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null || true; sleep 8; done; [ -n "$ok" ] || { echo "::error::push failed"; exit 1; }
