name: data
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['pipelines/**', 'models/**', '.github/workflows/data.yml']
  schedule:
    - cron: '20 20 * * 1-5'   # ~3:20 pm CT weekdays: NDPSR (Wed), class/advanced prices, FMMO stats
    - cron: '40 21 * * 5'     # Friday after COT release
permissions: {contents: write}
concurrency: {group: data, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests pandas git+https://github.com/rongardF/tvdatafeed.git
      - run: python pipelines/usda_dairy.py
      - run: python models/dairy_class.py
        continue-on-error: true
      - run: python pipelines/cot.py
        continue-on-error: true
      - run: python pipelines/prices.py
        continue-on-error: true
      - name: commit
        run: |
          git config user.name "bmr-data-bot"; git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "data: USDA dairy, COT, prices $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
