name: data
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['pipelines/**', 'models/**', 'data/cme/**', 'data/grains/raw/flash/**', '.github/workflows/data.yml']
  schedule:
    - cron: '20 20 * * 1-5'   # ~3:20 pm CT weekdays: NDPSR (Wed), class/advanced prices, FMMO stats
    - cron: '40 21 * * 5'     # Friday after COT release
permissions: {contents: write}
concurrency: {group: data, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests pandas git+https://github.com/rongardF/tvdatafeed.git
      - run: python pipelines/usda_dairy.py
      - run: python pipelines/usda_livestock.py
        continue-on-error: true
        env: {NASS_API_KEY: '${{ secrets.NASS_API_KEY }}'}
      - run: python pipelines/esmis.py
      - run: python pipelines/retention.py   # delete dated files older than ~6 months (OI totals kept), gzip report archives
        continue-on-error: true
      - run: python models/dairy_class.py
        continue-on-error: true
      - run: python models/dairy_sd.py
        continue-on-error: true
      - run: python pipelines/cot.py
        continue-on-error: true
      - run: python pipelines/prices.py
        continue-on-error: true
      - run: python pipelines/ohlc.py && python pipelines/tv_settle.py && python -W ignore models/technicals.py && python models/vol.py && python models/options_desk.py && python -W ignore models/research.py
        continue-on-error: true
      - run: python pipelines/ams_mars.py
        continue-on-error: true
        env: {AMS_API_KEY: '${{ secrets.AMS_API_KEY }}'}
      - run: python models/grains_wasde.py && python -W ignore models/grains_exports.py && python -W ignore models/grains_sales.py && python -W ignore models/grains_flash.py && python -W ignore models/grains_basis.py && python models/grains_condition.py && python -W ignore models/grains_tests.py
        continue-on-error: true
      - run: python models/flows.py
        continue-on-error: true
      - run: python models/dairy_backtest.py && python models/cot_backtest.py && python -W ignore models/dairy_convergence.py && python -W ignore models/dairy_spot.py && python -W ignore models/cot_desk.py && python -W ignore models/summary.py
        continue-on-error: true
      - run: python -W ignore models/grains_esr_brief.py && python -W ignore models/grains_wasde_brief.py && python -W ignore models/summary.py
        continue-on-error: true
      - run: python -W ignore models/grains_rv.py && python -W ignore models/report_reaction.py && python -W ignore models/trader_sheet.py
        continue-on-error: true
      - run: python -W ignore models/hogs.py && python -W ignore models/hogs_sd.py && python models/convergence_bias.py && python -W ignore models/hogs_convergence.py && python -W ignore models/hogs_expiry.py && python -W ignore models/cattle.py && python -W ignore models/cattle_sd.py
        continue-on-error: true
      - name: commit
        run: |
          git config user.name "bmr-data-bot"; git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "data: USDA dairy and livestock, COT, prices $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null || true; sleep 5; done; [ -n "$ok" ] || { echo "::error::push failed"; exit 1; }
