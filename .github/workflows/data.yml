name: data
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['pipelines/**', 'models/**', 'data/cme/**', 'data/grains/raw/flash/**', '.github/workflows/data.yml']
  schedule:
    - cron: '20 20 * * 1-5'   # ~3:20 pm CT weekdays: NDPSR (Wed), class/advanced prices, FMMO stats
    - cron: '40 21 * * 5'     # Friday after COT release
permissions: {contents: write}
concurrency: {group: data, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests pandas scipy git+https://github.com/rongardF/tvdatafeed.git
      - run: python pipelines/usda_dairy.py
      - run: python pipelines/usda_livestock.py
        continue-on-error: true
        env: {NASS_API_KEY: '${{ secrets.NASS_API_KEY }}'}
      - run: python pipelines/esmis.py
      - run: python pipelines/retention.py   # delete dated files older than ~6 months (OI totals kept), gzip report archives
        continue-on-error: true
      - run: python models/dairy_class.py || echo dairy_class >> "$RUNNER_TEMP/failed"
        continue-on-error: true
      - run: python models/dairy_sd.py || echo dairy_sd >> "$RUNNER_TEMP/failed"
        continue-on-error: true
      - run: python pipelines/cot.py
        continue-on-error: true
      - run: python pipelines/prices.py
        continue-on-error: true
      - run: |
          python pipelines/ohlc.py || echo "::warning::ohlc failed"
          python pipelines/tv_settle.py || echo "::warning::tv_settle failed"
          python -W ignore models/technicals.py || echo technicals >> "$RUNNER_TEMP/failed"
          python models/vol.py || echo vol >> "$RUNNER_TEMP/failed"
          python models/options_desk.py || echo options_desk >> "$RUNNER_TEMP/failed"
          python -W ignore models/research.py || echo research >> "$RUNNER_TEMP/failed"
        continue-on-error: true
      - run: python pipelines/ams_mars.py
        continue-on-error: true
        timeout-minutes: 15   # a slow AMS API must never block the COT/price commit
        env: {AMS_API_KEY: '${{ secrets.AMS_API_KEY }}'}
      - run: |
          python models/grains_wasde.py || echo grains_wasde >> "$RUNNER_TEMP/failed"
          python -W ignore models/grains_exports.py || echo grains_exports >> "$RUNNER_TEMP/failed"
          python -W ignore models/grains_sales.py || echo grains_sales >> "$RUNNER_TEMP/failed"
          python -W ignore models/grains_flash.py || echo grains_flash >> "$RUNNER_TEMP/failed"
          python -W ignore models/grains_basis.py || echo grains_basis >> "$RUNNER_TEMP/failed"
          python models/grains_condition.py || echo grains_condition >> "$RUNNER_TEMP/failed"
          python -W ignore models/grains_tests.py || echo grains_tests >> "$RUNNER_TEMP/failed"
          python -W ignore models/grains_pack.py || echo "::warning::grains_pack failed"
        continue-on-error: true
      - run: python models/flows.py || echo flows >> "$RUNNER_TEMP/failed"
        continue-on-error: true
      - run: |
          python models/dairy_backtest.py || echo dairy_backtest >> "$RUNNER_TEMP/failed"
          python models/cot_backtest.py || echo cot_backtest >> "$RUNNER_TEMP/failed"
          python -W ignore models/dairy_convergence.py || echo dairy_convergence >> "$RUNNER_TEMP/failed"
          python -W ignore models/dairy_spot.py || echo dairy_spot >> "$RUNNER_TEMP/failed"
          python -W ignore models/cot_desk.py || echo cot_desk >> "$RUNNER_TEMP/failed"
          python -W ignore models/summary.py || echo summary >> "$RUNNER_TEMP/failed"
          python -W ignore models/outlook_brief.py || echo outlook_brief >> "$RUNNER_TEMP/failed"
        continue-on-error: true
      - run: |
          python -W ignore models/grains_esr_brief.py || echo grains_esr_brief >> "$RUNNER_TEMP/failed"
          python -W ignore models/grains_wasde_brief.py || echo grains_wasde_brief >> "$RUNNER_TEMP/failed"
          python -W ignore models/balance_sheets.py || echo balance_sheets >> "$RUNNER_TEMP/failed"
          python -W ignore models/cotton_price_outlook.py || echo "::warning::cotton_price_outlook failed"
          python -W ignore models/summary.py || echo summary >> "$RUNNER_TEMP/failed"
          python -W ignore models/outlook_brief.py || echo outlook_brief >> "$RUNNER_TEMP/failed"
        continue-on-error: true
      - run: |
          python -W ignore models/grains_rv.py || echo grains_rv >> "$RUNNER_TEMP/failed"
          python -W ignore models/report_reaction.py || echo report_reaction >> "$RUNNER_TEMP/failed"
          python -W ignore models/trader_sheet.py || echo trader_sheet >> "$RUNNER_TEMP/failed"
        continue-on-error: true
      - run: |
          python -W ignore models/hogs.py || echo hogs >> "$RUNNER_TEMP/failed"
          python -W ignore models/hogs_sd.py || echo hogs_sd >> "$RUNNER_TEMP/failed"
          python models/convergence_bias.py || echo convergence_bias >> "$RUNNER_TEMP/failed"
          python -W ignore models/hogs_convergence.py || echo hogs_convergence >> "$RUNNER_TEMP/failed"
          python -W ignore models/hogs_expiry.py || echo hogs_expiry >> "$RUNNER_TEMP/failed"
          python -W ignore models/cattle.py || echo cattle >> "$RUNNER_TEMP/failed"
          python -W ignore models/cattle_sd.py || echo cattle_sd >> "$RUNNER_TEMP/failed"
        continue-on-error: true
      - name: commit
        run: |
          git config user.name "bmr-data-bot"; git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "data: USDA dairy and livestock, COT, prices $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null || true; sleep 5; done; [ -n "$ok" ] || { echo "::error::push failed"; exit 1; }
      - name: report failed models (their data above is committed either way; this only turns the run red)
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/failed" ]; then echo "::error::models failed: $(sort -u "$RUNNER_TEMP/failed" | tr '\n' ' ')"; exit 1; fi
