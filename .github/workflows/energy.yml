name: energy
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['pipelines/energy_eia.py', 'pipelines/energy_eia_specs.json', 'pipelines/energy_prices.py', '.github/workflows/energy.yml']
  schedule:
    - cron: '40 22 * * 1-5'   # after the US settle: prices, ETF option chains, EIA daily spot/futures
    - cron: '50 14 * * 3'     # Wednesday: EIA weekly petroleum status (10:30 ET; 14:30 UTC in daylight time)
    - cron: '50 15 * * 3'     # same in standard time
    - cron: '50 14 * * 4'     # Thursday: EIA weekly gas storage (10:30 ET)
    - cron: '50 15 * * 4'
permissions: {contents: write}
concurrency: {group: energy, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q yfinance requests pandas
      - name: EIA series (server-side, EIA_API_KEY secret)
        continue-on-error: true
        env: {EIA_API_KEY: '${{ secrets.EIA_API_KEY }}'}
        run: python -u pipelines/energy_eia.py
      - name: prices and ETF option chains (yfinance, Stooq fallback)
        continue-on-error: true
        run: |
          S="${{ github.event.schedule }}"
          case "$S" in "50 1"*) echo "EIA-only run";; *) python -u pipelines/energy_prices.py;; esac
      - name: energy summary for the morning brief
        continue-on-error: true
        run: python models/energy_summary.py
      - name: commit
        run: |
          git config user.name "bmr-data-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/energy
          git diff --cached --quiet && exit 0
          git commit -q -m "energy: EIA, prices, ETF options $(date -u +%F' '%H:%M)"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null || true; sleep 8; done; [ -n "$ok" ] || { echo "::error::push failed"; exit 1; }
