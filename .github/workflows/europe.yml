name: europe (EU grains, oilseeds and sugar trade, TAXUD)
on:
  workflow_dispatch:
    inputs:
      products: {description: 'products to run (default: wheat maize); "discover" lists sectors/products', required: false, default: ''}
  schedule:
    - cron: '23 16 * * 3'    # weekly; the Commission updates TAXUD surveillance data early in the week
permissions: {contents: write}
concurrency: {group: europe, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests pandas numpy
      - name: TAXUD exports/imports (commit after each product so a long backfill keeps its progress)
        run: |
          git config user.name "bmr-data-bot"; git config user.email "bot@users.noreply.github.com"
          save() { git add data/europe data/grains/derived/pack.json; git diff --cached --quiet && return 0
            git commit -q -m "data: EU cereal trade $1 $(date -u +%F)"
            for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && return 0; git rebase --abort 2>/dev/null || true; sleep 8; done; echo "::warning::push failed"; }
          P="${{ github.event.inputs.products }}"; [ -z "$P" ] && P="wheat maize oilseeds oils sugar"
          if [ "$P" = discover ]; then python -W ignore pipelines/eu_taxud.py discover; save discover; exit 0; fi
          for p in $P; do
            python -W ignore pipelines/eu_taxud.py $p || true
            python -W ignore models/grains_pack.py || true
            save $p
          done
