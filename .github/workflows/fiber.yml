name: fiber
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['pipelines/us_fiber.py', 'models/us_fiber.py', '.github/workflows/fiber.yml']
  schedule:
    - cron: '17 11 * * 1'     # weekly; Comtrade adds the US month about 6-8 weeks after it ends
permissions: {contents: write}
concurrency: {group: fiber, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q pandas numpy requests
      - name: US textile and apparel imports by HS6, monthly (UN Comtrade, new months only)
        continue-on-error: true
        timeout-minutes: 24
        run: python pipelines/us_fiber.py
      - name: cotton vs man-made share, ERS check, price lead/lag
        continue-on-error: true
        run: python -W ignore models/us_fiber.py
      - name: commit
        if: always()
        run: |
          git config user.name "bmr-data-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/fiber
          git diff --cached --quiet && exit 0
          git commit -q -m "data: US fibre imports $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null || true; sleep 5; done; [ -n "$ok" ] || { echo "::error::push failed"; exit 1; }
