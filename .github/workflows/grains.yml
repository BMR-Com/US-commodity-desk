name: grains
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['pipelines/crop_progress.py', '.github/workflows/grains.yml']
  schedule:
    - cron: '30 21 * * 1'     # Monday after Crop Progress (4 pm ET) and inspections
    - cron: '0 14 * * 2-5'    # weekday mornings: flash sales, Thursday export sales
    - cron: '30 17 * * 4'     # Thursday after weekly export sales (8:30 ET)
permissions: {contents: write}
concurrency: {group: grains, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests pandas
      - name: crop progress CORN
        continue-on-error: true
        env: {NASS_API_KEY: '${{ secrets.NASS_API_KEY }}', CP_MAX_BATCHES: '2000', C: 'CORN'}
        run: |
          python pipelines/crop_progress.py CORN
          git config user.name "bmr-data-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/grains
          git diff --cached --quiet || { git commit -q -m "data: grains crop progress $C $(date -u +%F)"; for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null; sleep 8; done; [ -n "$ok" ] || { echo "::error::push failed"; exit 1; }; }
      - name: crop progress SOYBEANS
        continue-on-error: true
        env: {NASS_API_KEY: '${{ secrets.NASS_API_KEY }}', CP_MAX_BATCHES: '2000', C: 'SOYBEANS'}
        run: |
          python pipelines/crop_progress.py SOYBEANS
          git config user.name "bmr-data-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/grains
          git diff --cached --quiet || { git commit -q -m "data: grains crop progress $C $(date -u +%F)"; for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null; sleep 8; done; [ -n "$ok" ] || { echo "::error::push failed"; exit 1; }; }
      - name: crop progress WHEAT
        continue-on-error: true
        env: {NASS_API_KEY: '${{ secrets.NASS_API_KEY }}', CP_MAX_BATCHES: '2000', C: 'WHEAT'}
        run: |
          python pipelines/crop_progress.py WHEAT
          git config user.name "bmr-data-bot"; git config user.email "bot@users.noreply.github.com"
