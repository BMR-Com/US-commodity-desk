name: grains
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['pipelines/crop_progress.py', '.github/workflows/grains.yml']
  schedule:
    - cron: '30 21 * * 1'     # Monday after Crop Progress (4 pm ET) and inspections
    - cron: '0 14 * * 2-5'    # weekday mornings: flash sales, Thursday export sales
    - cron: '30 17 * * 4'     # Thursday after weekly export sales (8:30 ET)
permissions: {contents: write}
concurrency: {group: grains, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests pandas
      - name: crop progress, condition, annual (batched)
        run: python pipelines/crop_progress.py CORN SOYBEANS WHEAT SORGHUM OATS BARLEY
        continue-on-error: true
        env: {NASS_API_KEY: '${{ secrets.NASS_API_KEY }}', CP_MAX_BATCHES: '2000'}
      - name: commit
        run: |
          git config user.name "bmr-data-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/grains
          git diff --cached --quiet && exit 0
          git commit -q -m "data: grains crop progress $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep 8; done
