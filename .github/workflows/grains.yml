          git diff --cached --quiet || { git commit -q -m "data: grains crop progress $C $(date -u +%F)"; for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null; sleep 8; done; [ -n "$ok" ] || { echo "::error::push failed"; exit 1; }; }
      - name: condition model and WASDE cross-check after Crop Progress
        continue-on-error: true
        run: |
          pip install -q numpy
          python models/grains_condition.py && python -W ignore models/grains_wasde_brief.py
          git add data/grains
          git diff --cached --quiet || { git commit -q -m "data: grains condition model $(date -u +%F)"; for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null; sleep 8; done; [ -n "$ok" ] || { echo "::error::push failed"; exit 1; }; }
