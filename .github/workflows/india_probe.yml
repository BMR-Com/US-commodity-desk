name: india-probe
on: {push: {branches: [tmp/india-probe]}}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python tmp/india_probe.py
      - run: |
          git config user.name bmr-data-bot; git config user.email bot@users.noreply.github.com
          git add tmp/india_probe3 && git commit -qm "probe output" && git push -q origin HEAD:tmp/india-probe
