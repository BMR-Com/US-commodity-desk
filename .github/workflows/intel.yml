name: intel
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['pipelines/news.py', 'pipelines/weather.py', 'pipelines/events_calendar.py', 'pipelines/south_america.py', 'models/south_america.py', '.github/workflows/intel.yml']
  schedule:
    - cron: '17 */3 * * *'     # news every 3 hours
permissions: {contents: write}
concurrency: {group: intel, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests pandas numpy openpyxl
      - run: python pipelines/news.py
        continue-on-error: true
      - name: weather, calendar, South America (about twice a day on the schedule; always on push/dispatch)
        run: |
          H=$(date -u +%H)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$H" != "12" ] && [ "$H" != "00" ]; then echo "skip heavy feeds"; exit 0; fi
          python pipelines/events_calendar.py || true
          timeout 900 python pipelines/weather.py || true
          python pipelines/south_america.py || true
          python models/south_america.py || true
          python -W ignore models/summary.py || true
        env: {FAS_API_KEY: '${{ secrets.FAS_API_KEY }}'}
      - name: commit
        run: |
          git config user.name "bmr-data-bot"; git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "intel: news, weather, calendar $(date -u +%F' '%H:%M)"
          for i in 1 2 3 4; do
            if ! git pull -q --rebase -X theirs origin main; then
              # a file deleted on main but rewritten here (modify/delete) cannot be auto-merged: follow main's deletion
              git status --porcelain | awk '/^(UD|DU) /{print $2}' | xargs -r git rm -q
              GIT_EDITOR=true git rebase --continue 2>/dev/null || { git rebase --abort 2>/dev/null || true; sleep 8; continue; }
            fi
            git push -q && ok=1 && break; sleep 8
          done; [ -n "$ok" ] || { echo "::error::push failed"; exit 1; }
