name: markets
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['pipelines/markets.py', 'pipelines/econ_calendar.py', 'models/macro.py', '.github/workflows/markets.yml']
  schedule:
    - cron: '7 11-22 * * 1-5'   # hourly, ~7 am to 6 pm ET (Yahoo: futures ~10-30 min delayed, FX/cash indices real time)
    - cron: '7 23 * * 0'        # Sunday evening as Asia opens
permissions: {contents: write}
concurrency: {group: markets, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests pandas
      - run: python pipelines/markets.py
      - run: python pipelines/econ_calendar.py
        continue-on-error: true
      - run: python models/macro.py
        continue-on-error: true
      - name: commit
        run: |
          git config user.name "bmr-data-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/markets data/macro
          git diff --cached --quiet && exit 0
          git commit -q -m "markets: snapshot $(TZ=America/New_York date +%F' '%H:%M) ET"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null || true; sleep 8; done; [ -n "$ok" ] || { echo "::error::push failed"; exit 1; }
