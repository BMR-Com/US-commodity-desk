name: probe
on: {workflow_dispatch: {}, push: {branches: [probe]}}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas git+https://github.com/rongardF/tvdatafeed.git
      - run: python probe/sources.py || true
        env:
          AMS_API_KEY: ${{ secrets.AMS_API_KEY }}
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add probe; git commit -m "probe output" || true; git push || true
