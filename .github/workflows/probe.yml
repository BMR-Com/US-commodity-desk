name: probe
on: {workflow_dispatch: {}, push: {branches: [probe, probe-metals]}}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas pypdf playwright git+https://github.com/rongardF/tvdatafeed.git && python -m playwright install --with-deps chromium
      - run: python probe/metals.py || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: probe, path: probe/, retention-days: 3}
