name: probe
on: {workflow_dispatch: {}, push: {branches: [probe, probe-metals]}}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas pypdf playwright git+https://github.com/rongardF/tvdatafeed.git && python -m playwright install --with-deps chromium
      - run: python probe/metals.py || true
      - if: always()
        run: |
          tar czf probe_out.tgz probe/m3; mkdir -p out; mv probe_out.tgz out/
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f out/probe_out.tgz; git commit -qm "probe output"; git push 2>&1 | tail -5
