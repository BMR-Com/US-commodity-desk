name: probe_gld
on: {workflow_dispatch: {}, push: {branches: [tmp/gld-probe]}}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests pandas openpyxl yfinance
      - run: python probe_gld/probe.py || true
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add probe_gld/out.txt; git commit -m "probe output" || true; git push || true
