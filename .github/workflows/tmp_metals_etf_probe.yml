name: tmp-metals-etf-probe
on: {push: {branches: [tmp/metals-etf-probe], paths: ['probe_etf/**', '.github/workflows/tmp_metals_etf_probe.yml']}, workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests pandas openpyxl xlrd lxml
      - run: |
          git fetch -q origin main && git checkout origin/main -- data/metals/raw
          cp probe_etf/metals_pipe.py pipelines/metals.py
          python -u probe_etf/gld.py 2>&1 | tee probe_etf/run.log || true
          mkdir -p probe_out4 && cp data/metals/raw/etf_*.csv data/metals/raw/fetch_log.json probe_out4/
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f probe_out4 probe_etf/run.log; git commit -qm "probe output [skip ci]" || true; git push || true
