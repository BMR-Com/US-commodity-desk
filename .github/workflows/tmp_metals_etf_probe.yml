name: tmp-metals-etf-probe
on: {push: {branches: [tmp/metals-etf-probe], paths: ['probe_etf/**', '.github/workflows/tmp_metals_etf_probe.yml']}, workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests pandas openpyxl xlrd lxml playwright && python -m playwright install --with-deps chromium > /dev/null
      - run: python probe_etf/probe.py || true
      - run: timeout 900 python probe_etf/browser.py || true
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          find probe_out -size +3M -delete; git add -f probe_out; git commit -qm "probe output [skip ci]" || true; git push || true
