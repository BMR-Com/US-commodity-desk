name: wx-ensemble
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['pipelines/wx_ensemble.py', '.github/workflows/wx_ensemble.yml']
  schedule:
    - cron: '17 9 * * *'     # after the 00z ensembles; before the morning brief
    - cron: '41 21 * * *'    # after the 12z ensembles
permissions: {contents: write}
concurrency: {group: wx-ensemble, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests pandas numpy
      - run: timeout 1800 python -u pipelines/wx_ensemble.py
      - name: commit
        run: |
          git config user.name "bmr-data-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/geo/wx_ensemble.json; git diff --cached --quiet && exit 0
          git commit -q -m "ensemble weather odds $(date -u +%F-%H%M)"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && ok=1 && break; git rebase --abort 2>/dev/null || true; sleep 8; done; [ -n "$ok" ] || exit 1
